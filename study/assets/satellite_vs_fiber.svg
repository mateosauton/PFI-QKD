<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">QKD por fibra vs QKD satelital</title>
  <desc id="desc">Comparison between fiber QKD using terrestrial spans and trusted nodes, and satellite QKD using free-space optical links to ground stations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#155eef"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 15px Arial, sans-serif; fill: #475467; }
      .label { font: 700 17px Arial, sans-serif; fill: #111827; }
      .small { font: 400 13px Arial, sans-serif; fill: #344054; }
      .earth { fill: #d1fadf; stroke: #079455; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #344054; stroke-width: 2; rx: 10; }
      .trusted { fill: #fff7ed; stroke: #c2410c; }
      .sat { fill: #e0f2fe; stroke: #155eef; stroke-width: 2; }
      .fiber { stroke: #344054; stroke-width: 7; fill: none; stroke-linecap: round; }
      .beam { stroke: #155eef; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .atmo { fill: none; stroke: #bfdbfe; stroke-width: 14; opacity: 0.65; }
      .note { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text x="60" y="54" class="title">Fibra y satelite resuelven problemas distintos</text>
  <text x="60" y="84" class="sub">La fibra es estable y continua; el satelite evita miles de km de perdida terrestre pero introduce tracking, clima y ventanas orbitales.</text>

  <rect x="80" y="135" width="1040" height="230" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" rx="16"/>
  <text x="110" y="175" class="label">Ruta terrestre por fibra</text>
  <path d="M 145 270 C 260 220, 350 320, 470 270 S 690 220, 810 270 S 980 320, 1055 270" class="fiber"/>
  <rect x="120" y="235" width="80" height="60" class="node"/>
  <text x="160" y="270" text-anchor="middle" class="small">Alice</text>
  <rect x="360" y="235" width="110" height="60" class="node trusted"/>
  <text x="415" y="263" text-anchor="middle" class="small">trusted</text>
  <text x="415" y="282" text-anchor="middle" class="small">node</text>
  <rect x="620" y="235" width="110" height="60" class="node trusted"/>
  <text x="675" y="263" text-anchor="middle" class="small">trusted</text>
  <text x="675" y="282" text-anchor="middle" class="small">node</text>
  <rect x="1000" y="235" width="80" height="60" class="node"/>
  <text x="1040" y="270" text-anchor="middle" class="small">Bob</text>
  <text x="150" y="330" class="small">Ventaja: operacion continua, metro/campus/data center. Limite: perdida exponencial; sin amplificadores cuanticos clasicos.</text>

  <rect x="80" y="405" width="1040" height="245" fill="#ffffff" stroke="#d0d5dd" stroke-width="2" rx="16"/>
  <text x="110" y="445" class="label">Ruta satelital / free-space</text>
  <path d="M 120 610 C 330 520, 860 520, 1080 610" class="earth"/>
  <path d="M 200 585 C 390 480, 815 480, 1000 585" class="atmo"/>
  <g transform="translate(565 445)">
    <rect x="-58" y="-25" width="116" height="50" class="sat" rx="12"/>
    <circle cx="-72" cy="0" r="12" class="sat"/>
    <circle cx="72" cy="0" r="12" class="sat"/>
    <text x="0" y="5" text-anchor="middle" class="small">satelite</text>
  </g>
  <rect x="170" y="560" width="120" height="55" class="node"/>
  <text x="230" y="592" text-anchor="middle" class="small">estacion A</text>
  <rect x="910" y="560" width="120" height="55" class="node"/>
  <text x="970" y="592" text-anchor="middle" class="small">estacion B</text>
  <path d="M 565 470 C 430 500, 315 535, 235 560" class="beam"/>
  <path d="M 565 470 C 700 500, 850 535, 965 560" class="beam"/>
  <text x="150" y="640" class="small">Ventaja: saltos continentales/globales. Limite: nubes, turbulencia, pointing, ventanas LEO y confianza en el satelite si actua como relay.</text>
</svg>
